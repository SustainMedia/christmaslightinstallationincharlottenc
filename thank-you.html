<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Christmas Light Installation</title>
    <meta name="description" content="Thank you for your submission.">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/css/style.css">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-16881071159"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'AW-16881071159');
    </script>


    <style>
        /* Reusing styles from your landing page for consistency */
        body {
            font-family: "Plus Jakarta Sans", sans-serif;
            color: #000000;
        }

        .standard_container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .simple-header {
            padding: 1rem 0;
            background-color: #ffffff;
            border-bottom: 1px solid #e9e9e9;
            text-align: center;
        }

        .simple-header img {
            max-height: 75px;
            width: auto;
        }

        /* Styles specific to the thank you page */
        .thank-you-section {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 83px); /* Full viewport height minus header height */
            background-color: #f8f8f8;
            padding: 3rem 0;
        }

        .thank-you-container {
            background-color: #ffffff;
            padding: 3rem 2.5rem;
            border-radius: 20px;
            text-align: center;
            max-width: 650px;
            margin: auto;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .thank-you-container h1 {
            font-family: "Plus Jakarta Sans", sans-serif;
            color: #3d2f2a;
            font-weight: 700;
            font-size: 3.5rem;
            margin-bottom: 1.5rem;
        }

        .thank-you-container p {
            font-size: 1.2rem;
            line-height: 1.7;
            margin-bottom: 0;
        }
        
        .thank-you-icon {
            width: 80px;
            height: 80px;
            margin-bottom: 1.5rem;
        }

        .phone-number {
            font-size: 2.25rem;
            font-weight: 700;
            color: #000000;
            margin-top: 2rem;
        }
        .phone-number a {
            color: inherit;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .phone-number a:hover {
            color: #C22837;
        }

        .home-btn {
            display: inline-block;
            margin-top: 2.5rem;
            padding: 0.85rem 2.5rem;
            background-color: #006044; /* Using green color from form focus */
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-family: "Open Sans", sans-serif;
            font-weight: 600;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .home-btn:hover {
            background-color: #C22837; /* Using brown color from headings */
            color: #ffffff;
            transform: translateY(-3px);
        }
    </style>
</head>

<body>

    <header class="simple-header">
        <a href="index.html">
            <img src="./assets/images/main-logo.svg" alt="Leslie Carpenter DDS Logo">
        </a>
    </header>

    <main class="thank-you-section">
        <div class="standard_container">
            <div class="thank-you-container">
                
                <svg class="thank-you-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                  <circle cx="26" cy="26" r="25" fill="#006044"/>
                  <path d="M14.1 27.2l7.1 7.2 16.7-16.8" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>

                <h1>Thank You!</h1>
                <p>Your appointment request has been sent successfully. Our team will review your information and contact you shortly to confirm the details. Or call us right now to get priority scheduling.</p>

                <h2 class="phone-number"><a href="tel:7042376919">(704) 237-6919</a></h2>
                
                <a href="index.html" class="home-btn">Return to Homepage</a>
            </div>
        </div>
    </main>

</body>

</html>
